[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensapex"
version = "1.400.4"
description = "Python wrapper for the Sensapex SDK"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.7"
license = "MIT"
authors = [
  {name = "Luke Campagnola", email = "luke.campagnola@gmail.com"},
]
dependencies = [
  "numpy",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Other Environment",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/sensapex/sensapex-py"

[tool.setuptools.packages.find]
include = ["sensapex", "sensapex.*", "tests", "tests.*"]

[tool.setuptools.cmdclass]
install = "sensapex._build.DownloadBinariesAndInstall"
develop = "sensapex._build.DownloadBinariesAndDevelop"
build_py = "sensapex._build.DownloadBinariesAndBuild"
